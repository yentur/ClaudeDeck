name: Bug report
description: Something in ClaudeDeck doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please check [existing issues](https://github.com/yentur/ClaudeDeck/issues) and the [FAQ](https://github.com/yentur/ClaudeDeck#faq) first.

        **Please remove personal information** (usernames in paths, project names, session IDs, prompts) from anything you paste below.
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu → About This Mac. Please include the chip (Apple Silicon or Intel).
      placeholder: macOS 15.6 (Apple Silicon)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ClaudeDeck version
      description: Shown at the bottom of Settings.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install ClaudeDeck?
      options:
        - Homebrew
        - Downloaded zip from GitHub Releases
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: terminal
    attributes:
      label: Terminal app
      description: Where your Claude Code sessions run (and where resumed sessions open).
      multiple: true
      options:
        - cmux
        - Terminal.app
        - iTerm2
        - Ghostty
        - Warp
        - WezTerm
        - kitty
        - Alacritty
        - tmux
        - VS Code / Cursor
        - Other (describe below)
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
      placeholder: 2.1.0 (Claude Code)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start two Claude Code sessions in …
        2. Click Sleep on …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Screenshots or a short screen recording help a lot.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Optional. Useful sources: Console.app filtered by "ClaudeDeck", or the output of running
        `/Applications/ClaudeDeck.app/Contents/MacOS/ClaudeDeck` from a terminal.
      render: text
