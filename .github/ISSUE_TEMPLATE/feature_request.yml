name: Feature request
description: Suggest an idea or a new terminal integration
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! ClaudeDeck stays local-only (no network, no telemetry) and never writes to `~/.claude`, so ideas need to fit those constraints.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
      placeholder: When I run many sessions, I can't tell …
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like ClaudeDeck to handle it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried.
  - type: input
    id: terminal
    attributes:
      label: Terminal app (if relevant)
      placeholder: e.g. Ghostty 1.3, tmux 3.5
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to help implement this
